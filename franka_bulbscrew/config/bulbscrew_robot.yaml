/**:
  ros__parameters:
    # Output topics of optitrack_bridge_node.
    bulb_pose_topic: /bulbscrew/bulb_pose
    joint_state_topic: /joint_states
    # franka_gripper is NOT started by moveit.launch.py -- that include is
    # commented out at line 340 -- so it needs its own terminal:
    #   ros2 launch franka_gripper gripper.launch.py robot_ip:=... namespace:=fr3
    # Its "namespace" argument has no default and launch fails without one.
    # With namespace:=fr3 the node comes up as /fr3/franka_gripper, hence these
    # names (verified live 2026-08-28, NOT the /fr3_gripper/... that MoveIt's
    # fr3_controllers.yaml implies).
    gripper_joint_state_topic: /fr3/franka_gripper/joint_states
    gripper_grasp_action: /fr3/franka_gripper/grasp
    gripper_move_action: /fr3/franka_gripper/move
    # mocap4r2_optitrack_driver hardcodes header.frame_id="map" on /rigid_bodies
    # and the bridge passes it through unchanged. NOTE this frame is Y-UP; the
    # driver's TF frame "optitrack" is Z-up. Do not mix the two -- see
    # SIM_ALIGNMENT.md section 0.
    optitrack_world_frame: map
    robot_base_frame: fr3_link0
    tcp_frame: fr3_hand_tcp

    rigid_bodies_topic: /rigid_bodies
    bulb_rigid_body_name: bulb-trirl
    pole_base_rigid_body_name: franka_pole_base

    command_source: teleop

    # ==========================================================================
    # NOTHING BELOW IS CALIBRATED YET. Both flags stay false until the values
    # are measured, and safety_node outputs zero while either is false.
    # Work through NEED_TO_CONFIGURE.md in order.
    # ==========================================================================
    # Steps 2-4 of NEED_TO_CONFIGURE.md are done and independently verified:
    # base anchor (0.04 mm loop closure), bulb frame (tip holds 18.0 mm through
    # a 357 deg spin), socket seat (0.52 deg from vertical).
    calibration_configured: true
    # PROVISIONAL bounds only -- see workspace_* below. Enabled so the arm can
    # be driven to find the real edges.
    workspace_configured: true

    # --- socket (bolted down, measured once) ----------------------------------
    # Position and orientation of the socket body in the OptiTrack "map" frame.
    # The seat -- the point the bulb's screw tip must reach -- is this pose
    # composed with socket_seat_offset (18 mm up the socket's own z, from the
    # sim's SEAT_OFF).
    #
    # The seat frame's ORIENTATION is what fixes the observation's axis layout.
    # Its z must be true vertical, or the vertical component lands in the wrong
    # slot while every number still looks plausible. On PushT that exact mistake
    # went unnoticed for a whole session.
    # Measured 2026-08-28 with the bulb screwed fully home: the seat IS the
    # screw tip in that configuration, so it was back-solved from the calibrated
    # bulb frame (57 samples, 0.58 mm marker jitter). The seat frame is taken as
    # the seated bulb's own frame, which puts its z along the socket axis --
    # measured 0.52 deg from true vertical, so the observation's vertical lands
    # in index 2 as bulbscrew_mjx expects.
    #
    # Seat in fr3_link0: [0.5996, 0.0970, 0.0195] -- 1.5 mm above the 18 mm
    # plank, 0.607 m reach. Re-measure if the socket is ever moved or unbolted.
    #
    # Note any error in bulb_tip_offset cancels here for the seated pose, since
    # the same offset defines both the tip and this seat.
    # RE-DERIVED 2026-08-30 through the re-measured 5-marker bulb frame, with
    # the bulb screwed fully home (482 mocap samples, 0.01-0.11 mm jitter). The
    # seat IS the screw tip in that configuration.
    #
    # Seat in fr3_link0: [0.5993, 0.0972, 0.0672] -- 28.3 mm above the measured
    # plank top (0.0389), which is where a socket standing on the plank belongs.
    # The seat frame's z is 0.64 deg from vertical, so the observation's vertical
    # component lands in index 2 as bulbscrew_mjx expects.
    #
    # Cross-check that did not feed the solve: the grasp arithmetic in
    # episode_0000 predicted z ~ 0.0711 from forward kinematics alone. Measured
    # 0.0672 -- 3.9 mm apart, from two chains sharing nothing.
    #
    # The superseded value was [2.044912, 0.005265, 1.397291], which put the
    # seat at z = 0.0195, i.e. 19 mm BELOW the plank the socket stands on. The
    # lateral terms were right all along; the whole error was vertical.
    fixed_socket_position: [2.046294, 0.054203, 1.395794]
    fixed_socket_quaternion_wxyz: [0.684591, -0.692390, -0.162113, -0.160157]
    socket_seat_offset: [0.0, 0.0, 0.018]

    # --- bulb (tracked as "bulb-trirl") ---------------------------------------
    # Motive's rigid-body frame is NOT the sim's bulb body frame: its origin is
    # wherever Motive put it and its axes follow Motive's Y-up convention. This
    # transform maps marker -> canonical bulb body, whose -z axis carries the
    # tip and neck offsets below.
    #
    # Do NOT "validate" this by placing the bulb at the socket and checking the
    # relative pose is small -- that is true for any frame convention and proves
    # nothing. Calibrate it against known geometry instead (NEED_TO_CONFIGURE.md
    # step 3 describes the sphere-probe method that worked on PushT).
    # Calibrated 2026-08-28.
    #
    # ORIENTATION. Motive defines this rigid body Y-UP like every other one
    # here: with the bulb standing upright its local +Y read 0.1-0.26 deg from
    # vertical, so canonical +Z = marker +Y. The bulb is a body of revolution
    # (sphere head, capsule neck, capsule screw), so rotation about its own axis
    # is physically meaningless and the in-plane choice is free -- canonical +X
    # = marker +X was taken. Unlike the PushT T-block there is no "which way
    # does the crossbar point" question, and the sim's success test
    # (d_seat + 0.1*upright_err) is yaw-invariant too.
    #
    # TRANSLATION. Solved from 124 samples while the bulb was spun through
    # 357 deg standing on the plank, using two constraints: the canonical origin
    # is a fixed physical point on the axis, and its height is known (plank at
    # 18 mm + the 53 mm tip offset). Residual RMS 1.25 mm. The axial term came
    # out -56.9 mm against -57.7 mm from an independent single-reading estimate
    # -- two methods agreeing to 0.8 mm. The perpendicular terms are only ~2 mm,
    # confirming Motive put the origin essentially on the bulb's axis.
    #
    # Verified end to end over all 124 samples: the computed screw tip holds
    # 18.0 mm with 1.0 mm spread (i.e. resting on the plank) through the full
    # rotation, uprightness 0.9994. That is the check that would fail if either
    # the axis or the offset were wrong -- and note it does NOT depend on the
    # socket, so it cannot be fooled the way "place it at the goal and see if
    # the relative pose is small" can.
    # RE-MEASURED 2026-08-30 for the 5-marker set (the earlier 3-marker
    # calibration is void: adding markers reassigns Motive's origin and axes).
    #
    # Method, replacing the one that produced the bad numbers: the bulb was
    # stood on the plank and spun through 675 deg while /rigid_bodies was
    # recorded (3841 samples, 31.8 s).
    #   * the AXIS location comes from the circle the marker origin sweeps --
    #     radius only 8.4 mm, fit residual rms 2.2 mm, so the two lateral terms
    #     are good to about +-3 mm and no better;
    #   * the AXIAL term comes from the plank top at z = 0.0389 in fr3_link0,
    #     touched directly with the closed gripper. That is a robot measurement
    #     with no mocap in it, and it is what the old calibration got wrong: it
    #     ASSUMED an 18 mm plank, 20.9 mm out.
    # Tip consistency across the sweep: 5.4 / 0.4 / 5.9 mm (x / axial / z).
    #
    # Do NOT re-derive this by imposing the tip offset. The obvious
    # fixed-contact-point solve is degenerate here -- the marker origin already
    # sits on the spin axis, so every point along the axis is stationary and the
    # least-squares places the contact arbitrarily (it returned -172 mm, i.e.
    # below the floor, on this very dataset).
    #
    # The marker origin sits 70.1 mm above the screw tip.
    bulb_marker_to_object_translation: [-0.00271, -0.01699, -0.0017]
    bulb_marker_to_object_quaternion_wxyz: [0.707107, -0.707107, 0.0, 0.0]
    # Along the canonical bulb body's z axis, from bulbscrew_mjx.
    #
    # The sim's bulb head is a 30 mm-radius sphere = 60 mm diameter, which
    # MATCHES the real bulb (measured 2026-08-28). The rest of the sim geometry,
    # to check against the real part: neck (the grasp point) is a 24 mm-diameter
    # capsule at z = -0.006, the screw base is 21 mm diameter at z = -0.038, and
    # the tip sits at z = -0.053. The neck is well inside the Franka Hand's 80 mm
    # opening. Note 21 mm is narrower than a standard E27 base (27 mm) -- if the
    # real bulb is an E27, these offsets and the socket cavity both need
    # revisiting on the sim side.
    #
    # Real measurements so far (2026-08-28): bulb 60 mm head diameter, 120 mm
    # overall height (sim 124 mm -- 3% over, fine). Holder is a tapered cup,
    # 85 mm square base narrowing to 55 mm at the top, 65 mm tall. Since the
    # 60 mm head sits over a 55 mm opening the bulb RESTS ON THE RIM with its
    # screw end hanging inside -- that fixes the start height and hence where
    # the gripper must reach for the neck. The sim's holder is a 24 mm square
    # only 30 mm tall and needs remodelling; see SIM_ALIGNMENT.md.
    # !! SUSPECT -- DO NOT COLLECT DATA UNTIL THIS IS SETTLED. !!
    # This value came from bulbscrew_mjx, not from the real bulb, and the
    # calibration below cannot detect an error in it because it was used as an
    # INPUT to that solve (see FINDINGS B16).
    #
    # Replaying the demonstration in the sim shows the bulb hanging ~52 mm below
    # the fingers that are demonstrably gripping it. Either this offset is wrong
    # or the mocap-to-robot anchor is ~52 mm low; the demonstration cannot tell
    # which, because the bulb is never tilted more than 25 deg while held, so
    # "along the bulb axis" and "vertical" are the same direction.
    #
    # To settle it, jog the TCP down to touch the plank and read
    #   ros2 run tf2_ros tf2_echo fr3_link0 fr3_hand_tcp
    #   plank at ~0.018 -> anchor is fine, this offset is wrong
    #   plank at ~0.070 -> anchor is 52 mm low
    # Then re-derive the culprit plus bulb_marker_to_object_translation and
    # fixed_socket_position, which inherit from the bulb frame either way.
    bulb_tip_offset: -0.053
    # GRASP POINT along the canonical bulb axis. bulbscrew_mjx calls this the
    # "neck" and puts it at -0.006, a 24 mm capsule just above the screw base.
    # On the real rig the bulb is held by its glass BODY instead: the jaws close
    # at 59.7 mm, i.e. across the 60 mm head at its widest point, which puts the
    # TCP at the head's centre -- +0.041 in the canonical frame.
    #
    # The neck is small and fragile; the head is the practical grip. Since
    # observation dims 7:10 are the tool relative to THIS point, the value has to
    # describe where the gripper actually goes, or those dims describe a grasp
    # that never happens. bulbscrew_mjx's NECK_OFF must be changed to match --
    # see SIM_ALIGNMENT.md.
    # MEASURED 2026-08-30, not inferred. The operator gripped the bulb exactly
    # as the task requires -- by the glass body, screwed home in the socket --
    # and the TCP was read against the calibrated bulb frame:
    #
    #   gripper width            58.0 mm   (the 60 mm head, as intended)
    #   TCP along the bulb axis  +36.7 mm  <- this value
    #   TCP off the axis           2.2 mm  <- the grasp is well centred
    #
    # That 2.2 mm also independently corroborates the bulb frame's lateral
    # terms, which the circle fit could only pin to about +-3 mm.
    #
    # The previous +41.0 mm was an inference from "the jaws close at 59.7 mm so
    # the TCP must be at the head centre". It was only 4.3 mm out, so it was
    # never the cause of the 52 mm discrepancy -- that was the bulb frame.
    #
    # bulbscrew_mjx's NECK_OFF is -0.006, a 24 mm capsule just above the screw
    # base. The real grasp is 43 mm higher up, on the glass. The sim must be
    # changed to match, or observation dims 7:10 describe a grasp that never
    # happens -- see SIM_ALIGNMENT.md.
    bulb_neck_offset: 0.0367

    # --- robot base anchor ----------------------------------------------------
    # Fixed offset from the franka_pole_base marker's Motive frame to fr3_link0.
    # Tracked live so the transform self-corrects if the whole stand is moved;
    # only the marker's mounting relative to fr3_link0 is baked in here.
    #
    # Derived 2026-08-28 from a fresh hand_eye_calibration (10 samples, settled
    # to a few mm) composed with a simultaneous franka_pole_base reading:
    #   fr3_link0 -> optitrack : xyz 2.57022 -1.40307 -0.00480
    #                            xyzw 0.00145 0.00165 0.99967 0.02555
    # Note that result is in the driver's Z-UP `optitrack` TF frame while
    # /rigid_bodies is Y-UP `map`, so an Rx(90 deg) sits between them. Skipping
    # it silently produces a metre-scale error that looks like a real
    # miscalibration -- see SIM_ALIGNMENT.md section 0.
    #
    # Verified by reconstructing fr3_link0's origin from the live marker plus
    # this offset and expressing it back in fr3_link0: error 0.02 mm.
    #
    # This REPLACES the values inherited from franka_pusht
    # ([-0.03004, 0.01107, -0.05296] / [-0.02892, 0.00431, 0.6888, 0.72436]),
    # which were stale by 52.1 mm and 3.98 deg. The marker had shifted on the
    # stand rather than the stand having been moved -- the two look identical in
    # mocap, and only a fresh calibration distinguishes them. The old values
    # reconstructed fr3_link0's origin 62.3 mm away from itself.
    # RETIRED 2026-08-30. The franka_pole_base markers cannot be kept visible on
    # this rig, and they are not needed: hand_eye_calibration gives fr3_link0 ->
    # optitrack directly. Kept only until observation_node is rewired to the
    # static anchor below.
    #
    # --- hand-eye anchor, measured 2026-08-30, 10 samples ----------------------
    # Emitted by optitrack_robot_calibration verbatim as a tf2 parent->child
    # transform, i.e.  p_fr3_link0 = R(quat) * p_optitrack + translation.
    # NOTE the direction: reading it the other way round moves the socket 75 mm
    # and looks like a calibration failure.
    #
    #   ros2 run tf2_ros static_transform_publisher \
    #     --frame-id fr3_link0 --child-frame-id optitrack \
    #     --x 2.56989 --y -1.40344 --z -0.00600 \
    #     --qx 0.00029 --qy 0.00007 --qz 0.99966 --qw 0.02613
    #
    # Sample-to-sample spread over the last 8 solutions: 6 mm x, 12 mm y,
    # 15 mm z. It reproduces the 2026-08-28 run to 0.3/0.4/1.2 mm, so the anchor
    # is stable across sessions.
    #
    # Independently validated: pushing the franka_pole_base marker through it
    # lands at [-0.001, -0.034, 0.024] in fr3_link0 -- 4 cm from the robot's own
    # base origin, which is where a marker plate on the base physically is. That
    # check does not reuse any part of the calibration.
    optitrack_to_robot_base_translation: [2.56989, -1.40344, -0.00600]
    optitrack_to_robot_base_quaternion_wxyz: [0.02613, 0.00029, 0.00007, 0.99966]

    # --- workspace ------------------------------------------------------------
    # Bounds on fr3_hand_tcp in fr3_link0 -- a STATIC frame. (Not the
    # observation's ee_rel_neck: that is measured against the bulb, which moves
    # and is near-constant once grasped, so clamping it would bound nothing.)
    #
    # PROVISIONAL, 2026-08-28. Generous box chosen only so the arm can be driven
    # at all, sized to contain the three known task points with margin:
    #   bulb neck (grasp)  [0.742, -0.161, 0.038]
    #   socket seat (goal) [0.600,  0.097, 0.020]
    #   home               [0.671, -0.032, 0.250]
    # z stays above 0.02 to keep the tool off the work surface; note the grasp
    # itself is at 0.038, so the lower bound cannot be raised much.
    #
    # NOT the measured-safe envelope -- step 6 of NEED_TO_CONFIGURE.md is still
    # owed. Drive to each real edge, read the tool pose, and tighten. Keep the
    # bounds off the working region: when clamped, executed_action is zeroed
    # while the operator is still commanding, which is self-consistent but makes
    # unnatural demonstrations, and on PushT a too-tight bound silently stalled
    # the policy mid-episode.
    workspace_x: [0.35, 0.85]
    workspace_y: [-0.35, 0.30]
    workspace_z: [0.02, 0.45]
