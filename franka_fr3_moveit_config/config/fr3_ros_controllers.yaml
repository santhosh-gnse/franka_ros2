/**: 
  controller_manager:
    ros__parameters:
      update_rate: 1000 
      overruns:
        manage: false
        print_warnings: false

      fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

      # Kinesthetic teaching: hold the arm against gravity so it can be guided
      # by hand while FCI stays ON -- so /joint_states keeps publishing real
      # values and mocap keeps tracking, which Desk's guiding mode does not
      # allow (there the controllers go inactive and a fallback publisher serves
      # frozen defaults).
      #
      # Claims the same effort interfaces as fr3_arm_controller, so exactly one
      # of the two may be active. Switch with
      #   ros2 run franka_bulbscrew guiding_mode --ros-args -p enable:=true|false
      gravity_compensation_example_controller:
        type: franka_example_controllers/GravityCompensationExampleController

      # General-purpose anisotropic Cartesian stiffness/damping holding (per-axis
      # via ~set_cartesian_stiffness, equilibrium via ~equilibrium_pose).
      # Registered here as available infrastructure, not currently driven by
      # any package's guiding workflow: franka_pizza tried using it to lock
      # height/orientation during kinesthetic teaching and hit sustained
      # oscillation the moment the tool touched a rigid surface -- a
      # rigid-on-rigid contact instability, not a tuning bug -- and reverted to
      # plain gravity compensation for teaching instead (see franka_pizza's
      # kinesthetic_recorder_node.py docstring for the full account). The
      # controller's own damping law was still genuinely wrong at the time
      # (2*sqrt(K) assumes a 1 kg reflected mass regardless of true
      # configuration) and has since been fixed to use the real
      # operational-space mass; that fix is unrelated to the contact-instability
      # finding above and remains real, verified infrastructure for whenever a
      # proper contact-aware controller is needed. Same effort-interface
      # conflict as the other controllers here: exactly one may be active.
      cartesian_impedance_example_controller:
        type: franka_example_controllers/CartesianImpedanceExampleController

/**: 
  fr3_arm_controller:
    ros__parameters:
      allow_nonzero_velocity_at_trajectory_end: true
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      gains:
        fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }
