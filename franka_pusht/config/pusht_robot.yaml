/**:
  ros__parameters:
    # Output topic of optitrack_bridge_node (it republishes /rigid_bodies as
    # per-marker PoseStamped). observation_node subscribes to this directly.
    # There is no EE marker topic: the real pusher tool carries no OptiTrack
    # marker, so the EE pose comes from forward kinematics instead (see
    # ee_from_tf below).
    block_pose_topic: /pusht/t_block_pose
    goal_pose_topic: /unused_when_goal_is_fixed
    goal_is_fixed: true
    # Goal = the CANONICAL block frame at the physical goal placement, i.e.
    # objectPushT's raw marker pose there composed with
    # block_marker_to_object_* below. Position is the raw marker position
    # and quaternion were both recomputed 2026-08-20 when the frame
    # conventions were fixed -- it is no longer the raw marker quaternion
    # (which was [0.999793, -0.012341, -0.011156, -0.011748]).
    #
    # This must stay equal to q_marker_at_goal * q_block_marker_to_object, or
    # block_quat_rel_goal stops being identity when the block reaches the goal
    # and the sim's success test (norm(rotvec(block_quat_rel_goal)) -> 0)
    # silently never fires.
    fixed_goal_position: [2.074922, 0.057855, 1.319202]
    fixed_goal_quaternion_wxyz: [0.016196, 0.000419, 0.715687, 0.698234]
    joint_state_topic: /joint_states
    # mocap4r2_optitrack_driver hardcodes header.frame_id="map" on /rigid_bodies,
    # and optitrack_bridge_node passes that header through unchanged.
    optitrack_world_frame: map
    robot_base_frame: fr3_link0
    # Inputs to optitrack_bridge_node: the mocap4r2 topic, the tracked
    # rigid-body name for the T-block, and a marker fixed to the robot's
    # stand/base (tracked live, used to keep the EE's forward-kinematics pose
    # correctly anchored in the OptiTrack world frame). No EE rigid body is
    # tracked (the real pusher tool has no marker on it).
    rigid_bodies_topic: /rigid_bodies
    block_rigid_body_name: objectPushT
    pole_base_rigid_body_name: franka_pole_base
    command_source: teleop
    calibration_configured: true
    # Modest bump from the shared 0.05 default now that dead-man/timeout/
    # workspace/controller issues are all confirmed working. Still holding off
    # on a bigger increase until goal_to_robot_quaternion_wxyz is validated.
    max_linear_speed: 0.08
    # Rotation converting goal-frame velocity into fr3_link0. Derived
    # 2026-08-20 as R_(fr3_link0<-map) * R_goal, where R_(fr3_link0<-map) =
    # R_handeye * Rx(90deg) -- the Rx(90) accounts for mocap4r2 publishing
    # /rigid_bodies Y-UP in frame "map" while its TF frame "optitrack" (what
    # the hand-eye calibration solved against) is Z-UP. Verified live:
    # objectPushT maps to [2.080, -1.282, 0.091] in TF vs [2.0796, 0.0910,
    # 1.2820] on /rigid_bodies.
    #
    # The result is ~identity (4.4 deg yaw, 1.9 deg tilt), which independently
    # reproduces pusht_mjx, where the goal body carries quat="1 0 0 0" and the
    # goal frame is axis-aligned with the robot base -- a strong check that the
    # whole chain is now consistent with sim.
    #
    # The previous value was ~175.5deg, i.e. wrong by ~180deg: it composed the
    # Z-up hand-eye rotation with the Y-up goal quaternion, omitting the Rx(90).
    # It had seemed "validated" by a teleop direction test, but that test was
    # circular -- it compared FK motion against the commanded action using this
    # same rotation to build the command, so it could only ever confirm that
    # Servo executes base-frame twists faithfully, never that this value is
    # right. Because of the ~180deg error, actions recorded before 2026-08-20
    # are sign-flipped in X/Y.
    goal_to_robot_quaternion_wxyz: [0.999127, 0.008619, -0.014088, -0.038362]
    # Motive's objectPushT rigid body is defined Y-UP (its local +Y is the
    # block's thickness axis -- verified live: local +Y maps to [0.001, 0.013,
    # 1.000] in fr3_link0). pusht_mjx's canonical block frame is Z-UP with +X
    # running along the stem toward the crossbar (scene_mjx_free.xml: stem box
    # +-0.05 in x, crossbar at x=+0.075, half-thickness 0.025 in z).
    #
    # So this offset maps marker -> canonical as: canonical +X = marker -X
    # (the stem direction, identified physically on 2026-08-20), canonical +Z =
    # marker +Y, canonical +Y = marker +Z. That is a 180 deg rotation about
    # (0, 1, 1)/sqrt(2), hence the exact 0.707107 values.
    #
    # This was previously identity, which put the VERTICAL axis at index 1 of
    # block_pos_rel_goal/ee_pos_rel_goal while pusht_mjx (and therefore the
    # trained policy) reads index 2 as vertical -- the position triples were
    # genuinely scrambled relative to sim. Identity had appeared "validated"
    # only because placing the block at the goal gives a near-identity relative
    # pose for ANY frame convention, so that test proved nothing.
    #
    # Translation measured 2026-08-20 by sphere-probe touch-off. fr3_pusher_tcp
    # is the CENTRE of the pusher's 15 mm sphere (custom_pusher_ee.xacro), so at
    # contact the TCP sits exactly 15 mm along the touched face's outward
    # normal regardless of approach angle -- the same principle as a CMM touch
    # probe. Each touch gives one linear equation
    #     m^T offset = m^T v - (plane + 0.015),   m = R_off n_canonical,
    #     v = R_marker^T (p_tip_map - p_marker)
    # Touched stem_end, crossbar_end and one crossbar side face; solved by
    # least squares (residuals +-1.21 mm, exactly half the +2.4 mm by which this
    # block is longer than sim's, which is what lstsq should do).
    #
    # The marker origin sits ~32 mm toward the crossbar from the stem-bar
    # centre. Previously this was [0,0,0], which biased block_pos_rel_goal by up
    # to ~2*32 mm as the block rotated away from the goal orientation -- against
    # sim's success_threshold of 0.05 on pos_err+orn_err.
    #
    # The middle (marker +Y = vertical) component could not be measured by the
    # probe -- no touched face constrains it -- and was initially left at 0.
    # For block_pos_rel_goal that is harmless: the bias enters only as
    # (R_marker - R_marker_goal) * offset, and with the block flat on the table
    # the block-to-goal rotation is a pure yaw about the vertical, which leaves
    # a vertical vector unchanged, so it cancels exactly.
    #
    # It does NOT cancel for ee_pos_rel_goal, though, because the goal carries
    # the offset and the pusher does not -- so it shifts the EE's height
    # relative to the goal, which the policy sees. Recovered geometrically once
    # the table height was measured (2026-08-20): the table sits at z=0.020 in
    # fr3_link0 and the block is 50 mm thick, so the canonical (mid-thickness)
    # origin must be at z=0.045, while the marker frame reads 0.0788 -- putting
    # the markers 33.8 mm above mid-height. Marker +Y is vertical (measured as
    # [0.001, 0.013, 1.000] in fr3_link0), so the component is -0.0338.
    #
    # The probe measured the overall block length as 152.4 mm from the two
    # opposite end faces -- a by-product independent of the offset itself.
    # The physical block was then confirmed by hand to be 150 mm long, 120 mm
    # across the crossbar and 50 mm in width/thickness, i.e. identical to the
    # sim geometry, so that 2.4 mm is probe error (1.6%) rather than a real
    # size difference. It also corroborates that the stem axis is marker -X,
    # since the length only comes out right under that assumption.
    block_marker_to_object_translation: [0.03189, -0.0338, 0.00126]
    block_marker_to_object_quaternion_wxyz: [0.0, 0.0, 0.707107, 0.707107]
    # EE pose comes from forward kinematics (robot_base_frame -> tcp_frame via
    # /tf), composed with the live optitrack-world -> robot-base transform
    # (pole_base_pose_topic composed with the fixed offset below) -- not from
    # an OptiTrack marker on the tool (see observation_node).
    #
    # pole_base_to_robot_base_* is the fixed offset from franka_pole_base's own
    # Motive-defined frame to the true fr3_link0 origin. Bootstrapped on
    # 2026-08-17 from a hand-eye calibration (fr3_link0<->fr3_pusher_tcp via
    # tf2_echo, paired with map<->franka-ck-calibr via /rigid_bodies; residuals
    # ~0.6-2.4cm / 0.1-0.4deg across 4 held-static poses) combined with one
    # simultaneous map<->franka_pole_base reading. Only needs redoing if
    # franka_pole_base's mount relative to fr3_link0 changes -- not if the
    # whole stand is moved in the room (that's what tracking it live corrects).
    ee_from_tf: true
    tcp_frame: fr3_pusher_tcp
    pole_base_to_robot_base_translation: [-0.03004, 0.01107, -0.05296]
    pole_base_to_robot_base_quaternion_wxyz: [-0.02892, 0.00431, 0.6888, 0.72436]
    # Provisional bounds for the goal_to_robot_quaternion_wxyz direction test
    # only (2026-08-18), centered loosely on the EE position at that time
    # ([-0.061, 0.247, -0.048]). NOT yet the final calibrated workspace --
    # NEED_TO_CONFIGURE.md step 6 (move to each true safe edge and read
    # ee_pos_rel_goal) still needs to be done properly.
    workspace_configured: true
    workspace_x: [-0.35, 0.35]
    # Lower y bound widened from -0.20 to -0.35 on 2026-08-20: the policy stalled
    # against it mid-episode (ee_pos_rel_goal[1] hit -0.2008 and the per-axis
    # clamp zeroed the action). The pusher has to get around the block, which
    # starts at block_pos_rel_goal ~ [0.13, -0.13], so it needs more room in -y
    # than the old provisional box allowed. pusht_mjx has no workspace clamp at
    # all (only a 1 m block-divergence guard), so the policy never learned about
    # this limit. STILL NOT the measured-safe envelope -- step 6 is owed.
    workspace_y: [-0.35, 0.60]
    workspace_z: [-0.20, 0.20]
