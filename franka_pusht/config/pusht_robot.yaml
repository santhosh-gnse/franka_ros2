/**:
  ros__parameters:
    # Output topics of optitrack_bridge_node (it republishes /rigid_bodies as
    # per-marker PoseStamped). observation_node subscribes to these directly.
    block_pose_topic: /pusht/t_block_pose
    ee_pose_topic: /pusht/ee_marker_pose
    goal_pose_topic: /unused_when_goal_is_fixed
    goal_is_fixed: true
    fixed_goal_position: [2.122078, 0.076128, 1.325715]
    fixed_goal_quaternion_wxyz: [0.999839, 0.003016, 0.003239, -0.017377]
    joint_state_topic: /joint_states
    # mocap4r2_optitrack_driver hardcodes header.frame_id="map" on /rigid_bodies,
    # and optitrack_bridge_node passes that header through unchanged.
    optitrack_world_frame: map
    robot_base_frame: fr3_link0
    # Inputs to optitrack_bridge_node: the mocap4r2 topic and the exact rigid-body
    # names assigned to the two tracked markers in Motive.
    rigid_bodies_topic: /rigid_bodies
    block_rigid_body_name: objectPushT
    ee_rigid_body_name: franka-ck-calibr
    command_source: teleop
    calibration_configured: false
    # Rotation used to convert goal-frame policy velocity into fr3_link0.
    goal_to_robot_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    block_marker_to_object_translation: [0.0, 0.0, 0.0]
    block_marker_to_object_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    ee_marker_to_tcp_translation: [0.0, 0.0, 0.0]
    ee_marker_to_tcp_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    workspace_configured: false
    # Safe TCP bounds expressed in the goal frame.
    workspace_x: [0.0, 0.0]
    workspace_y: [0.0, 0.0]
    workspace_z: [0.0, 0.0]
